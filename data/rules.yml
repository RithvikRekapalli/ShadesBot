version: "3.1"

rules:

- rule: Say goodbye and end the conversation
  steps:
  - intent: goodbye
  - action: utter_goodbye
  - action: action_session_end  # ✅ Ensures session ends properly without conflicts

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle fallback when bot doesn't understand
  steps:
  - intent: nlu_fallback
  - action: utter_fallback

- rule: Greet user when they start a conversation
  steps:
  - intent: greet
  - action: utter_greet

- rule: Allow returning to the main menu anytime
  steps:
  - intent: return_to_main_menu
  - action: utter_return_to_main_menu

- rule: Handle service selection (numbered options)
  steps:
  - intent: select_option
  - action: action_handle_service_selection
