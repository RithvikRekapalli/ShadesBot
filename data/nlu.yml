version: "3.1"

nlu:
- intent: greet
  examples: |
    - Hi
    - Hello
    - Hey there
    - Good morning
    - What's up?
    - Hi there
    - Hey

- intent: select_option
  examples: |
    - 1
    - 2
    - 3
    - 4
    - 5
    - I choose 1
    - Option 2
    - Number 3
    - Pick 4
    - Select 5

- intent: return_to_main_menu
  examples: |
    - 0
    - main menu
    - go back
    - return to main menu
    - restart

- intent: goodbye
  examples: |
    - Bye
    - Goodbye
    - See you later
    - Thanks, that was helpful.
    - I am done

- intent: bot_challenge
  examples: |
    - Are you a bot?
    - Who are you?
    - Are you human?
    - Are you real?

- intent: nlu_fallback
  examples: |
    - I don't get it
    - What are you saying?
    - That's confusing
    - This doesn't make sense
