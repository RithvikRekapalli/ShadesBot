version: "3.1"

intents:
  - greet
  - select_option
  - return_to_main_menu
  - goodbye
  - bot_challenge
  - nlu_fallback

slots:
  option:
    type: text
    mappings:
      - type: from_text

responses:
  utter_greet:
    - text: |
        👋 Hello! Welcome to Shades LLC. How can I assist you today?
        Please choose an option by typing or saying the corresponding number:
        1️⃣ Website & Software Development
        2️⃣ Mobile App Development
        3️⃣ AI & Automation Solutions
        4️⃣ Branding & Digital Presence
        5️⃣ IT Staffing & Hiring
        🔄 Say or type '0' to return to the main menu anytime.

  utter_website_options:
    - text: |
        🌐 You selected **Website & Software Development**. What do you need?
        1️⃣ Business Websites
        2️⃣ E-Commerce Platforms
        3️⃣ Custom Web Applications
        🔄 Say or type '0' to return to the main menu.

  utter_mobile_options:
    - text: |
        📱 You selected **Mobile App Development**. What do you need?
        1️⃣ iOS App Development
        2️⃣ Android App Development
        3️⃣ Cross-Platform Apps
        🔄 Say or type '0' to return to the main menu.

  utter_ai_options:
    - text: |
        🤖 You selected **AI & Automation Solutions**. What do you need?
        1️⃣ AI-Powered Chatbots
        2️⃣ Business Process Automation
        3️⃣ Data Analytics & ML Models
        🔄 Say or type '0' to return to the main menu.

  utter_branding_options:
    - text: |
        🎨 You selected **Branding & Digital Presence**. What do you need?
        1️⃣ Logo & Branding
        2️⃣ Social Media Marketing
        3️⃣ SEO Optimization
        🔄 Say or type '0' to return to the main menu.

  utter_staffing_options:
    - text: |
        👨‍💻 You selected **IT Staffing & Hiring**. What do you need?
        1️⃣ IT Staff Augmentation
        2️⃣ Dedicated Development Teams
        3️⃣ Recruitment & Hiring Services
        🔄 Say or type '0' to return to the main menu.

  utter_return_to_main_menu:
    - text: |
        🔄 Returning to the main menu...
        Please choose an option:
        1️⃣ Website & Software Development
        2️⃣ Mobile App Development
        3️⃣ AI & Automation Solutions
        4️⃣ Branding & Digital Presence
        5️⃣ IT Staffing & Hiring
        (Say or type a number to continue)
        🔄 Say or type '0' to return to the main menu anytime.

  utter_goodbye:
    - text: |
        👋 Goodbye! Thank you for using Shades LLC chatbot. Before you go, we'd love your feedback!
        👉 [Click here to provide feedback](https://your-feedback-form.com)
        
        Have a great day! 😊

  utter_fallback:
    - text: |
        ⚠️ Sorry, I didn't understand that. 
        Please select a number from the menu or say 'Main Menu' to return.

  utter_iamabot:
    - text: "🤖 I am a bot, here to assist you with Shades LLC services!"

actions:
  - utter_greet
  - utter_website_options
  - utter_mobile_options
  - utter_ai_options
  - utter_branding_options
  - utter_staffing_options
  - utter_return_to_main_menu
  - utter_goodbye
  - utter_fallback
  - utter_iamabot
  - action_handle_voice_input
  - action_handle_service_selection
  - action_session_end

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
